name: Python Black Formatter

on:
  push:
    branches: [main]

jobs:
  black:
    name: Black으로 자동 포맷 및 Pull Request 생성
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run:  |
          python -m pip install --upgrade pip
          pip install black[jupyter]

      - name: Black 실행
        id: black
        uses: psf/black@stable
        with:
          src: "."
          jupyter: true

      - name: 변경사항 확인
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: 새 브랜치 생성하고 변경사항 푸시
        id: branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH_NAME=black-format/update-$(date +'%Y%m%d-%H%M%S')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "Black으로 코드 자동 포맷"
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Pull Request 생성
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          title: "Black으로 코드 자동 포맷"
          body: "이 Pull Request는 GitHub Actions에 설정된 Black 자동 포맷으로 생성되었습니다."
          base: main
