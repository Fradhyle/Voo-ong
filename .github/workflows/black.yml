name: Python Black Formatter

on:
  push:
    branches: [main]
    
jobs:
  Run-Black:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: "3.12"
    
    - name: Install dependencies
      run:  |
        python -m pip install --upgrade pip
        pip install black[jupyter]
    
    - name: Run Black
      uses: psf/black@stable
      with:
          src: "./"
          jupyter: true
    
    - name: Check for changes
      id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create new branch and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH_NAME=black-format/update-$(date +'%Y%m%d-%H%M%S')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "chore: format code with Black"
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        id: push_branch

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.push_branch.outputs.branch_name }}
          title: "chore: auto-format code with Black"
          body: "This PR contains automatic code formatting changes via Black."
          base: main
